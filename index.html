<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B59C3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cardbox">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Cardbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column; header with tabs, then a single active view (decks, browse, stats, study). */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16212C; --muted:#5E6B78; --line:#D5DCE3;
  --accent:#2B59C3; --accent-ink:#FFFFFF; --soft:#E4ECFB;
  --good:#1F8A4C; --good-soft:#E1F3E8; --warn:#9A6414; --warn-soft:#F8EBD3; --bad:#B8362F; --bad-soft:#F9E1DF;
  --shadow:0 1px 2px rgba(22,33,44,.06),0 6px 18px rgba(22,33,44,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#18212A; --ink:#E7EDF2; --muted:#96A4B1; --line:#2B3743;
  --accent:#7BA2F2; --accent-ink:#0F151B; --soft:#1E2B44;
  --good:#5FCB8A; --good-soft:#18301F; --warn:#E0AE5A; --warn-soft:#352A14; --bad:#EF7F78; --bad-soft:#3A1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#18212A; --ink:#E7EDF2; --muted:#96A4B1; --line:#2B3743;
  --accent:#7BA2F2; --accent-ink:#0F151B; --soft:#1E2B44;
  --good:#5FCB8A; --good-soft:#18301F; --warn:#E0AE5A; --warn-soft:#352A14; --bad:#EF7F78; --bad-soft:#3A1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin-inline:auto;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{font:700 24px var(--f-display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:26px;height:20px;border:2px solid var(--accent);border-radius:4px;position:relative;background:var(--surface)}
.brand i::after{content:"";position:absolute;inset:3px -6px -6px 3px;border:2px solid var(--accent);border-radius:4px;opacity:.45;z-index:-1}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;color:var(--muted)}

/* shared controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field textarea,.field select,.search{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--accent)}

/* deck list */
.decks{display:grid;gap:12px;margin-top:14px}
.deck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:16px 18px}
.deck h3{font-size:19px;overflow-wrap:anywhere}
.counts{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap}
.counts span{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.counts b{font-weight:500;color:var(--ink)}
.counts .n b{color:var(--accent)}.counts .d b{color:var(--good)}
.deck .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tag{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:middle}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}

/* browse */
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.q{max-width:260px;overflow-wrap:anywhere}
.pill{font:500 12px var(--f-mono);padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.due{background:var(--good-soft);color:var(--good)}
.pill.late{background:var(--bad-soft);color:var(--bad)}

/* stats */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font:700 30px var(--f-display);line-height:1.1}
.stat .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:12px}
.bars div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars span{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars em{font:400 11px var(--f-mono);color:var(--muted);font-style:normal}

/* study */
.sbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 16px}
.sbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,36px);min-height:220px;display:flex;flex-direction:column;gap:18px}
.card .lbl{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.card .txt{font:600 clamp(22px,4.2vw,32px)/1.25 var(--f-display);overflow-wrap:anywhere;white-space:pre-wrap}
.card .ans{border-top:1px dashed var(--line);padding-top:16px}
.card .ans .txt{color:var(--accent)}
.cover{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--bg) 10px 20px)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.opt kbd{font:500 12px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);flex:none}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.typed{display:flex;gap:10px;flex-wrap:wrap}
.typed input{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.verdict{padding:10px 14px;border-radius:10px;font-weight:600}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.rate button small{font:400 12px var(--f-mono);color:var(--muted)}
.rate button.sug{box-shadow:0 0 0 2px var(--accent)}
.rate .again{color:var(--bad)}.rate .hard{color:var(--warn)}.rate .good{color:var(--good)}.rate .easy{color:var(--accent)}
.done{text-align:center;padding:40px 16px}
.done h2{font-size:28px;margin-bottom:6px}

/* fill in the blanks */
.cz{font:500 clamp(18px,3.4vw,24px)/2.15 var(--f-body);white-space:pre-wrap;overflow-wrap:anywhere}
.cz .blank{font:inherit;font-weight:600;display:inline-block;vertical-align:baseline;border:0;border-bottom:2px solid var(--accent);background:var(--soft);color:var(--ink);border-radius:6px 6px 0 0;padding:0 8px;line-height:1.5;margin-inline:2px;text-align:center;max-width:100%}
.cz select.blank{padding:0 2px;width:auto;min-width:7ch}
.cz .gap{display:inline-block;min-width:6ch;border-bottom:2px solid var(--muted);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--bg) 6px 12px);color:var(--muted);font:500 .62em var(--f-mono);padding:0 8px;line-height:2;vertical-align:baseline;border-radius:4px 4px 0 0;margin-inline:2px}
.cz .fill{font-weight:600;color:var(--accent);border-bottom:2px solid var(--accent);padding:0 4px}
.cz .ok{color:var(--good);background:var(--good-soft);border-radius:6px;padding:0 6px;font-weight:600}
.cz .no{color:var(--bad);background:var(--bad-soft);text-decoration:line-through;border-radius:6px;padding:0 6px}
.cz .fix{color:var(--good);font-weight:600;margin-left:4px}
.tag.fi{background:var(--soft);color:var(--accent);margin:0 6px 0 0}
.help{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.help code{font:500 12px var(--f-mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.preview{font:500 15px/1.9 var(--f-body);white-space:pre-wrap;overflow-wrap:anywhere}
.preview .gap{border-bottom:2px solid var(--accent);background:var(--soft);padding:0 8px;border-radius:4px 4px 0 0;font-weight:600;color:var(--accent)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));overflow-y:auto;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:520px;margin-block:auto;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:21px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:520px){
  .deck{grid-template-columns:1fr}.deck .acts{justify-content:flex-start}
  .rate{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs{width:100%}.tabs button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i></i>Cardbox</div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="row" style="gap:8px"><button class="iconbtn" id="syncBtn">Sync</button><button class="iconbtn" id="themeBtn" title="Switch theme" aria-label="Switch theme">Theme</button></div>
  </header>
  <main id="view"></main>
</div>
<div id="layer"></div>
<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const DAY = 86400000;
const startOfDay = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dkey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
function toast(msg) {
  const old = $('.toast'); if (old) old.remove();
  const t = h('div', { class: 'toast', role: 'status', text: msg });
  document.body.append(t); setTimeout(() => t.remove(), 2400);
}

/* ---------- state ---------- */
const LS = 'cardbox.v1';
let S = { decks: [], prefs: { mode: 'reveal', newPerDay: 20, shuffle: true }, prefsMod: 0, log: {}, dead: {} };

/* Fill-in-the-blank cards keep their raw text in `f`, e.g. "Paris is the capital of {{France::country}}".
   Anki style {{c1::France}} also works. `b` holds the answers so search, export and the browse list keep working. */
const CLOZE_RE = /\{\{(?:c\d+::)?(.+?)(?:::(.+?))?\}\}/g;
function clozeParse(text) {
  const parts = []; let last = 0, n = 0, m; CLOZE_RE.lastIndex = 0;
  while ((m = CLOZE_RE.exec(text))) {
    if (m.index > last) parts.push({ t: text.slice(last, m.index) });
    parts.push({ a: m[1].trim(), hint: (m[2] || '').trim(), i: n++ }); last = m.index + m[0].length;
  }
  if (last < text.length) parts.push({ t: text.slice(last) });
  return parts;
}
const clozeAnswers = text => clozeParse(text).filter(p => p.a != null).map(p => p.a);
const hasCloze = text => clozeAnswers(text).length > 0;
const isCloze = c => c.type === 'cloze';
function newCard(f, b, type) {
  const c = { id: uid(), f, b, ease: 2.5, ivl: 0, due: 0, reps: 0, lapses: 0, created: Date.now(), mod: Date.now() };
  if (type === 'cloze') { c.type = 'cloze'; c.b = clozeAnswers(f).join(' · '); }
  return c;
}
function seed() {
  // fixed ids and mod 0, so example decks never duplicate when two devices sync
  const mk = (key, name, pairs) => ({ id: 'ex-' + key, name, sample: true, mod: 0, cards: pairs.map(([f, b], i) => Object.assign(newCard(f, b, b == null ? 'cloze' : undefined), { id: 'ex-' + key + '-' + i, mod: 0 })) });
  S.decks = [
    mk('capitals', 'Indian state capitals', [
      ['Capital of Tamil Nadu', 'Chennai'], ['Capital of Kerala', 'Thiruvananthapuram'],
      ['Capital of Karnataka', 'Bengaluru'], ['Capital of Maharashtra', 'Mumbai'],
      ['Capital of Rajasthan', 'Jaipur'], ['Capital of West Bengal', 'Kolkata'],
      ['Capital of Odisha', 'Bhubaneswar'], ['Capital of Assam', 'Dispur']]),
    mk('biology', 'Biology basics', [
      ['Organelle that produces most of a cell’s ATP', 'Mitochondrion'],
      ['Process by which plants make glucose from light', 'Photosynthesis'],
      ['Molecule that carries genetic information', 'DNA'],
      ['Basic unit of life', 'Cell'],
      ['Pigment that captures light in chloroplasts', 'Chlorophyll'],
      ['Enzyme that unwinds DNA during replication', 'Helicase'],
      ['The {{mitochondria::organelle}} make most of the cell’s {{ATP}} through {{cellular respiration}}.', null],
      ['Plants take in {{carbon dioxide}} and water. Using light energy in the {{chloroplasts}}, they make {{glucose}} and release {{oxygen}}.', null]])
  ];
}

/* ---------- persistence: db (per-viewer) with localStorage mirror ---------- */
let dbc = null, uidv = null, dirty = new Set(), flushing = false, flushTimer = null;
const userCol = () => dbc.collection('data/users/' + uidv);
function lsSave() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function lsLoad() { try { const r = localStorage.getItem(LS); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function save(...docIds) {
  lsSave();
  if (syncCfg()) scheduleSync();
  if (!dbc || !uidv) return;
  (docIds.length ? docIds : ['prefs', ...S.decks.map(d => 'deck_' + d.id)]).forEach(i => dirty.add(i));
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 600);
}
async function flush() {
  if (flushing) { flushTimer = setTimeout(flush, 400); return; }
  flushing = true;
  try {
    while (dirty.size) {
      const id = dirty.values().next().value; dirty.delete(id);
      if (id === 'prefs') await userCol().doc('prefs').set({ prefs: S.prefs, prefsMod: S.prefsMod || 0, log: S.log, dead: S.dead || {}, order: S.decks.map(d => d.id) });
      else {
        const d = S.decks.find(x => 'deck_' + x.id === id);
        if (d) await userCol().doc(id).set({ name: d.name, sample: !!d.sample, mod: d.mod || 0, cards: d.cards });
        else await userCol().doc(id).delete();
      }
    }
  } catch (e) {
    if (e && e.code === 'quota_exceeded') toast('Storage is full. Delete a deck or some cards.');
    else if (e && e.code === 'invalid_argument') toast('A deck is too large to sync. Split it into smaller decks.');
  }
  flushing = false;
}
/* ---------- merge: combine this device with another copy, newest edit wins ---------- */
const modOf = x => (x && x.mod) || 0;
function mergeStates(a, b) {                     // a = this device, b = other copy. Never mutates either.
  const dead = Object.assign({}, b.dead || {});
  for (const [k, v] of Object.entries(a.dead || {})) dead[k] = Math.max(dead[k] || 0, v);
  const gone = o => dead[o.id] != null && dead[o.id] >= modOf(o);
  const meta = new Map(), cards = new Map();
  for (const src of [a, b]) for (const d of src.decks || []) {
    const cur = meta.get(d.id);
    if (!cur) meta.set(d.id, { id: d.id, name: d.name, sample: d.sample, mod: modOf(d) });
    else if (modOf(d) > cur.mod) Object.assign(cur, { name: d.name, sample: d.sample, mod: modOf(d) });
    for (const c of d.cards || []) {
      const hit = cards.get(c.id);
      if (!hit || modOf(c) > modOf(hit.card)) cards.set(c.id, { card: c, deck: d.id });
    }
  }
  const byDeck = new Map();
  for (const { card, deck } of cards.values()) { if (gone(card)) continue; (byDeck.get(deck) || byDeck.set(deck, []).get(deck)).push(card); }
  const decks = [];
  for (const d of meta.values()) {
    if (gone(d)) continue;
    decks.push({ id: d.id, name: d.name, ...(d.sample ? { sample: true } : {}), mod: d.mod, cards: byDeck.get(d.id) || [] });
  }
  const newer = (b.prefsMod || 0) > (a.prefsMod || 0);
  const log = {};
  for (const src of [a, b]) for (const [k, l] of Object.entries(src.log || {})) {
    const t = log[k] || (log[k] = { n: 0, ok: 0, fresh: 0 });
    t.n = Math.max(t.n, l.n || 0); t.ok = Math.max(t.ok, l.ok || 0); t.fresh = Math.max(t.fresh, l.fresh || 0);
  }
  return { decks, prefs: newer ? b.prefs : a.prefs, prefsMod: Math.max(a.prefsMod || 0, b.prefsMod || 0), log, dead };

}

/* ---------- theme + boot ---------- */
const THEMES = ['auto', 'light', 'dark']; let theme = 'auto';
try { theme = localStorage.getItem('cardbox.theme') || 'auto'; } catch (e) {}
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme);
  $('#themeBtn').textContent = 'Theme: ' + theme;
  try { localStorage.setItem('cardbox.theme', theme); } catch (e) {}
}
$('#themeBtn').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(); });
applyTheme();

const saved = lsLoad();
if (saved && saved.decks) S = Object.assign(S, saved, { prefs: Object.assign(S.prefs, saved.prefs) }); else { seed(); lsSave(); }
nav('decks');
$('#syncBtn').addEventListener('click', syncModal);
initDb().then(() => { setSyncLabel(); if (!dbc && syncCfg()) scheduleSync(300); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
